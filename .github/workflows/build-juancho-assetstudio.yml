name: Build Juancho AssetStudio

permissions:
  contents: write

on:
  push:
    branches:
      - build/juancho-assetstudio
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Test Visual Lab core
        shell: pwsh
        run: dotnet run --project tests/JuanchoVisualLabCore.SmokeTests.csproj --configuration Release

      - name: Clone AssetStudio upstream
        shell: pwsh
        run: git clone --depth 1 https://github.com/perfare/AssetStudio.git "$env:GITHUB_WORKSPACE\AssetStudio"

      - name: Apply Juancho Texture2D feature
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE\build\patch.ps1"'

      - name: Apply Juancho MLBB Visual Lab foundation
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/build/patch-visual-lab.ps1"'

      - name: Restore
        working-directory: AssetStudio
        shell: pwsh
        run: dotnet restore .\AssetStudioGUI\AssetStudioGUI.csproj

      - name: Build native AssetStudio decoder
        working-directory: AssetStudio
        shell: pwsh
        run: |
          $vswhere = (Get-Item 'Env:ProgramFiles(x86)').Value + '\Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsPath) { throw "Visual Studio MSBuild was not found." }
          $msbuild = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild .\Texture2DDecoderNative\Texture2DDecoderNative.vcxproj /m /p:Configuration=Release /p:Platform=x64

      - name: Clone AssetsTools.NET native texture encoder
        shell: pwsh
        run: git clone --depth 1 https://github.com/nesrak1/AssetsTools.NET.git "$env:GITHUB_WORKSPACE\AssetsToolsNative"

      - name: Build native texture encoder
        working-directory: AssetsToolsNative
        shell: pwsh
        run: |
          $vswhere = (Get-Item 'Env:ProgramFiles(x86)').Value + '\Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsPath) { throw "Visual Studio installation was not found." }
          $devCmd = Join-Path $vsPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $devCmd)) { throw "VsDevCmd.bat was not found." }
          $command = '"{0}" -arch=x64 -host_arch=x64 && cmake --preset x64-release && cmake --build out\build\x64-release --config Release' -f $devCmd
          cmd.exe /c $command
          if ($LASTEXITCODE -ne 0) { throw "Native texture encoder build failed." }

      - name: Fetch classdata.tpk
        shell: pwsh
        run: |
          $zip = "$env:GITHUB_WORKSPACE\classdata.zip"
          $extract = "$env:GITHUB_WORKSPACE\classdata"
          Invoke-WebRequest -Uri "https://nightly.link/AssetRipper/Tpk/workflows/type_tree_tpk/master/uncompressed_file.zip" -OutFile $zip
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $tpk = Get-ChildItem $extract -Filter "*.tpk" -Recurse | Where-Object { $_.Length -gt 0 } | Select-Object -First 1
          if (-not $tpk) {
            $files = Get-ChildItem $extract -Recurse | Select-Object -ExpandProperty FullName
            throw ("No .tpk file was found in the AssetRipper Tpk package. Archive contents:" + [Environment]::NewLine + ($files -join [Environment]::NewLine))
          }
          Copy-Item $tpk.FullName "$env:GITHUB_WORKSPACE\classdata.tpk" -Force

      - name: Publish self-contained Windows x64
        working-directory: AssetStudio
        shell: pwsh
        run: dotnet publish .\AssetStudioGUI\AssetStudioGUI.csproj -c Release -f net8.0-windows -r win-x64 --self-contained true -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=false -o "$env:GITHUB_WORKSPACE\publish"

      - name: Copy native AssetStudio helpers
        shell: pwsh
        working-directory: AssetStudio
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\publish\x64" | Out-Null
          if (-not (Test-Path ".\Texture2DDecoderNative\bin\x64\Release\Texture2DDecoderNative.dll")) { throw "Texture2DDecoderNative.dll was not built." }
          Copy-Item ".\Texture2DDecoderNative\bin\x64\Release\Texture2DDecoderNative.dll" "$env:GITHUB_WORKSPACE\publish\x64\Texture2DDecoderNative.dll" -Force
          $encoderDir = "$env:GITHUB_WORKSPACE\AssetsToolsNative\out\build\x64-release\TextureEncoder"
          if (-not (Test-Path "$encoderDir\textureencoder.dll")) { throw "textureencoder.dll was not built." }
          if (-not (Test-Path "$encoderDir\cuttlefish.dll")) { throw "cuttlefish.dll was not built." }
          Copy-Item "$encoderDir\textureencoder.dll" "$env:GITHUB_WORKSPACE\publish\textureencoder.dll" -Force
          Copy-Item "$encoderDir\cuttlefish.dll" "$env:GITHUB_WORKSPACE\publish\cuttlefish.dll" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\classdata.tpk" "$env:GITHUB_WORKSPACE\publish\classdata.tpk" -Force

      - name: Package
        shell: pwsh
        run: |
          $readme = @'
          Juancho Studio — AssetStudio + MLBB Visual Lab foundation

          Open AssetStudioGUI.exe.

          Visual Lab:
          1. Open Menu -> MLBB Visual Lab.
          2. Scan a package folder or select multiple Unity bundles.
          3. Visual Lab automatically analyzes selected Unity files after the scan and opens the interactive player if it finds a GameObject hierarchy and AnimationClip.
          4. In the player choose a model root and AnimationClip, then click Load Model + Clip. Use Play/Pause/Stop, Loop, speed, scrubbing, and mouse orbit/pan/zoom.
          5. Use the Serialized Objects tab to inspect object type, source file, Path ID, and resolved/unresolved references.
          6. Use Preview Selected Model / Mesh (static) for geometry inspection, or Inspect Selected AnimationClip for duration, curve bindings/key counts, and events.
          7. Use Skill Timeline to author and save manual event timings.

          Safety:
          - Visual Lab parses isolated temporary copies of selected Unity input files.
          - Source package files are not written by the Visual Lab inventory or object-analysis functions.
          - Save scan reports and timeline projects outside the imported source folders.
          - Bundle grouping includes filename/folder heuristics; only serialized PPtr references are actual parsed dependencies.
          
          Current limitations:
          - The player is an initial reconstruction adapter: direct position/scale/rotation channels are interpolated and CPU skinning is attempted when weights, bind poses, and bone references are available. It is not Unity's exact Animator.
          - Humanoid/muscle-only clips requiring Avatar reconstruction, AnimatorController/state machines, and game-specific logic are not yet supported.
          - Recovered MLBB materials/textures/original shaders are not rendered; Unity particle/trail playback and executable skill timelines remain unimplemented.
          - Validate real hero packages on Windows; a successful build alone does not prove the selected model/clip binding is correct.
          - Reproducing full MLBB skill behavior requires the relevant runtime logic as well as asset data.

          Existing Juancho Texture2D replacement:
          1. Load your Unity .unity3d / assets file in the main AssetStudio window.
          2. Select exactly one Texture2D.
          3. Open Juancho -> Replace selected texture.
          4. Select the replacement image and confirm Texture2D settings.
          5. Save. This explicit texture-edit operation writes to the opened Unity file and keeps a .bak backup.
          '@
          Set-Content "$env:GITHUB_WORKSPACE\publish\README-Juancho.txt" $readme -Encoding UTF8
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\publish\*" -DestinationPath "$env:GITHUB_WORKSPACE\Juancho-AssetStudio-Windows-x64.zip" -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Juancho-AssetStudio-Windows-x64
          path: Juancho-AssetStudio-Windows-x64.zip
          if-no-files-found: error

      - name: Publish latest package
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "juancho-latest"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Juancho AssetStudio latest" --notes "Latest Windows x64 build."
          }
          gh release upload $tag "$env:GITHUB_WORKSPACE\Juancho-AssetStudio-Windows-x64.zip" --repo "${{ github.repository }}" --clobber
